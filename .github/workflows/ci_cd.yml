name: CI
on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
  workflow_dispatch:

env:
  MAIN_PYTHON_VERSION: '3.12'
  DOCUMENTATION_CNAME: 'dataflow-extensions.grantami.docs.pyansys.com'
  LIBRARY_NAME: 'ansys-grantami-dataflow-extensions'
  LIBRARY_NAMESPACE: 'ansys.grantami.dataflow-extensions'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  check-vulnerabilities:
    name: "Check library vulnerabilities"
    runs-on: windows-latest
    steps:
      - uses: ansys/actions/check-vulnerabilities@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          python-package-name: ${{ env.LIBRARY_NAME }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}
          use-uv: true

  actions-security:
    name: "Check actions security"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-actions-security@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: 'high'
          trust-ansys-actions: true

  code-style:
    name: "Code style"
    runs-on: windows-latest
    steps:
      - uses: ansys/actions/code-style@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          skip-install: false

      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Type check library
        run: |
          uv run --frozen --group tests mypy ./src

  doc-style:
    name: "Documentation style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/doc-style@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          vale-version: "2.29.6"

  doc-build:
    name: Documentation Build
    runs-on: windows-latest
    steps:
    - name: "Run Ansys documentation building action"
      uses: ansys/actions/doc-build@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
      with:
        check-links: false
        dependencies: "pandoc"
        sphinxopts: "-n -W --keep-going"
        skip-dependencies-cache: true
        group-dependencies-name: "doc"
        optional-dependencies-name: ""

  build-wheelhouse:
    name: "Build wheelhouse for latest Python versions"
    runs-on: windows-latest
    needs: code-style
    permissions:
      attestations: write  # Required to generate attestations
      id-token: write  # Required for Sigstore
    strategy:
       matrix:
           python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: ansys/actions/build-wheelhouse@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          operating-system: "win"
          python-version: ${{ matrix.python-version }}
          attest-provenance: true

  unit-tests:
    name: "Run unit tests"
    runs-on: windows-latest
    needs: code-style
    strategy:
       matrix:
           python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: ansys/actions/tests-pytest@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          python-version: ${{ matrix.python-version }}
          group-dependencies-name: "tests"
          use-uv: true

  build-library:
    name: "Build library"
    runs-on: windows-latest
    needs: [ build-wheelhouse, unit-tests, doc-build ]
    permissions:
      attestations: write  # Required to generate attestation
      id-token: write  # Required for Sigstore
    steps:
      - uses: ansys/actions/build-library@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true

  doc-deploy-dev:
    name: "Deploy development documentation"
    runs-on: ubuntu-latest
    needs: [ build-library ]
    if: github.event_name == 'push' && !contains(github.ref, 'refs/tags')
    permissions:
      contents: write  # to allow the Action to push to the gh-pages branch
    steps:
      - uses: ansys/actions/doc-deploy-dev@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          doc-artifact-name: documentation-html
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    environment: release
    permissions:
      id-token: write  # Required for trusted publisher auth to PyPI
      contents: write  # To allow the Action to upload a release asset
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

      - uses: ansys/actions/release-github@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        name: "Release to GitHub"
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-deploy-stable:
    name: "Deploy stable documentation"
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    permissions:
      contents: write  # To allow the Action to push to the gh-pages branch
    steps:
      - uses: ansys/actions/doc-deploy-stable@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          doc-artifact-name: documentation-html
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  update-changelog:
    name: "Update CHANGELOG (on release)"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to allow the Action to push to the repo
      pull-requests: write  # to allow the Action to create a PR if needed
    steps:
      - uses: ansys/actions/doc-deploy-changelog@f5e1481b9c128197a30d1dc1dfc52b8cd6865555  # v11.1.5
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
